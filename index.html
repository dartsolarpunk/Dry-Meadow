<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dry Meadow | Official Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#000; --text:#fff; --accent:#ffaa33; --border:rgba(255,255,255,0.15); --dark:#1a1a1a; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--bg); color:var(--text); font-family:'Oswald',sans-serif; }
#hero { position:relative; height:100vh; width:100%; overflow:hidden; }
#canvas-container { position:absolute; inset:0; z-index:1; }
#ui { position:absolute; inset:0; z-index:10; pointer-events:none; }
#ui > * { pointer-events:auto; }
.logo { position:absolute; top:28px; left:36px; font-size:1.4rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
.projects { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); text-align:center; font-size:0.85rem; letter-spacing:4px; text-transform:uppercase; }
#speaker { position:absolute; bottom:36px; right:36px; width:44px; height:44px; border:1px solid var(--border); background:rgba(0,0,0,0.4); color:var(--text); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
#menu-btn { position:absolute; top:24px; right:36px; background:none; border:none; color:var(--text); font-size:1.8rem; cursor:pointer; }
.side-menu { position:fixed; top:0; right:-320px; width:300px; height:100%; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); border-left:1px solid var(--border); transition:right 0.35s ease; z-index:20; padding:80px 32px; }
.side-menu.open { right:0; }
.side-menu a { display:block; color:var(--text); text-decoration:none; font-size:1.3rem; margin:22px 0; text-transform:uppercase; }
#waveform { position:absolute; bottom:120px; left:0; width:100%; height:60px; pointer-events:none; z-index:5; }
#loader { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:50; color:#fff; font-size:1.2rem; }
.content { position:relative; z-index:5; background:#000; }
.shop-section { padding:60px 20px; text-align:center; }
.shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; max-width:900px; margin:0 auto; }
.shop-item { background:#1a1a1a; padding:40px 20px; border-radius:8px; }
.footer { padding:50px 20px; background:#111; text-align:center; }
.newsletter-form { max-width:500px; margin:20px auto; }
.newsletter-input { width:100%; padding:14px; margin-bottom:10px; background:transparent; border:1px solid #555; color:#fff; border-radius:5px; }
.newsletter-submit { width:100%; padding:14px; background:#fff; color:#000; border:none; border-radius:5px; font-weight:700; text-transform:uppercase; cursor:pointer; }
</style>
</head>
<body>
<div id="hero">
  <div id="loader">Loading Sol...</div>
  <div id="canvas-container"></div>
  <div id="ui">
    <div class="logo">DRY MEADOW</div>
    <button id="menu-btn">☰</button>
    <div class="projects">PROJECTS</div>
    <button id="speaker">🔊</button>
    <canvas id="waveform"></canvas>
  </div>
</div>
<div class="content">
  <section class="shop-section">
    <h2 style="margin-bottom:30px; text-transform:uppercase; letter-spacing:2px;">SHOP</h2>
    <div class="shop-grid">
      <div class="shop-item"><div>Music</div></div>
      <div class="shop-item"><div>Animation</div></div>
      <div class="shop-item"><div>Contact</div></div>
    </div>
  </section>
  <footer class="footer">
    <h3 class="footer-title">NEWSLETTER</h3>
    <form class="newsletter-form" onsubmit="event.preventDefault(); alert('Subscribed');">
      <input class="newsletter-input" type="email" placeholder="Email address" required>
      <button class="newsletter-submit" type="submit">Subscribe</button>
    </form>
    <div style="margin-top:40px; font-size:0.85rem; color:#aaa;">
      <a href="mailto:justin@drymeadow.com" style="color:#fff; margin:0 10px;">Contact</a>
      <a href="https://youtube.com/@dry.meadow" style="color:#fff; margin:0 10px;">YouTube</a>
      <a href="https://music.apple.com/us/artist/drymeadow/1774189791" style="color:#fff; margin:0 10px;">Apple Music</a>
    </div>
  </footer>
</div>
<div class="side-menu" id="sideMenu">
  <button style="position:absolute; top:20px; right:20px; background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;" onclick="document.getElementById('sideMenu').classList.remove('open')">✕</button>
  <a href="https://radicaldeepscale.com/brpnaudio.html">Arc Edge Audio</a>
  <a href="https://dartmeadow.artstation.com/">Animation</a>
  <a href="https://dart-meadow-shop.fourthwall.com/">Shop</a>
  <a href="mailto:justin@drymeadow.com">Contact</a>
  <a href="https://music.apple.com/us/artist/drymeadow/1774189791">Apple Music</a>
  <a href="https://youtube.com/@dry.meadow">YouTube</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
document.getElementById('menu-btn').onclick = () => document.getElementById('sideMenu').classList.add('open');

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.2);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// Lighter gold Sol-style procedural sun
const sunGeo = new THREE.SphereGeometry(1.2, 128, 128);
const texCanvas = document.createElement('canvas');
texCanvas.width = 512; texCanvas.height = 512;
const ctx = texCanvas.getContext('2d');
const imgData = ctx.createImageData(512, 512);
for (let i = 0; i < imgData.data.length; i += 4) {
  const n = Math.random() * 0.35 + 0.65;
  imgData.data[i] = 255 * n;
  imgData.data[i+1] = 200 * n;
  imgData.data[i+2] = 80 * n;
  imgData.data[i+3] = 255;
}
ctx.putImageData(imgData, 0, 0);
const texture = new THREE.CanvasTexture(texCanvas);
const sunMat = new THREE.MeshBasicMaterial({ map: texture });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

const corona = new THREE.Mesh(new THREE.SphereGeometry(1.35, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.3, side: THREE.BackSide }));
scene.add(corona);

// Music playlist
const tracks = [
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/clinical_bloom.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/skyboard_journey.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/colder_than_the_sun.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/temple_of_light.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/velvet_horizon.mp3'
];
const audio = new Audio();
audio.crossOrigin = 'anonymous';
function playRandom() {
  audio.src = tracks[Math.floor(Math.random() * tracks.length)];
  audio.play().catch(()=>{});
}
audio.addEventListener('ended', playRandom);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 256;
const dataArray = new Uint8Array(analyser.frequencyBinCount);
let source = null, playing = false;
const speaker = document.getElementById('speaker');
const wave = document.getElementById('waveform');
const wCtx = wave.getContext('2d');

speaker.onclick = async () => {
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (!source) {
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if (!playing) {
    if (!audio.src) playRandom(); else audio.play();
    playing = true; speaker.textContent = '🔇';
  } else {
    audio.pause(); playing = false; speaker.textContent = '🔊';
  }
};

function drawWave() {
  requestAnimationFrame(drawWave);
  if (!playing) { wCtx.clearRect(0,0,wave.width,wave.height); return; }
  analyser.getByteTimeDomainData(dataArray);
  wCtx.clearRect(0,0,wave.width,wave.height);
  wCtx.strokeStyle = 'rgba(255,200,100,0.7)';
  wCtx.beginPath();
  const slice = wave.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const y = (dataArray[i] / 128.0 * wave.height) / 2;
    if (i === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    x += slice;
  }
  wCtx.stroke();
}
drawWave();

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  wave.width = window.innerWidth;
  wave.height = 60;
}
window.addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  sun.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();

// Hide loader once ready
setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 800);
</script>
</body>
</html>
