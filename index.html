<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dry Meadow | Official Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --text: #ffffff;
  --muted: #a0a0a0;
  --accent: #ffaa33;
  --gray: #1a1a1a;
  --border: rgba(255,255,255,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Oswald', sans-serif; overflow: hidden; }
#canvas-container { position: fixed; inset: 0; z-index: 1; }
canvas { display: block; width: 100%; height: 100%; }
#ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#ui > * { pointer-events: auto; }
.logo { position: absolute; top: 28px; left: 36px; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.projects { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; }
.projects::before { content: ''; display: block; width: 60px; height: 1px; background: var(--text); margin: 0 auto 12px; opacity: 0.6; }
#speaker { position: absolute; bottom: 36px; right: 36px; width: 44px; height: 44px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
#speaker:hover { background: rgba(255,255,255,0.1); }
#speaker svg { width: 20px; height: 20px; fill: currentColor; }
#menu-btn { position: absolute; top: 24px; right: 36px; background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }
.side-menu { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-left: 1px solid var(--border); transition: right 0.35s ease; z-index: 20; padding: 80px 32px; }
.side-menu.open { right: 0; }
.side-menu a { display: block; color: var(--text); text-decoration: none; font-size: 1.3rem; margin: 22px 0; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
.side-menu a:hover { color: var(--accent); }
.close-menu { position: absolute; top: 24px; right: 24px; background: none; border: none; color: var(--text); font-size: 1.6rem; cursor: pointer; }
#waveform { position: absolute; bottom: 120px; left: 0; width: 100%; height: 60px; pointer-events: none; z-index: 5; }
@media (max-width: 768px) {
  .logo { top: 20px; left: 20px; font-size: 1.1rem; }
  #menu-btn { top: 16px; right: 20px; }
  #speaker { bottom: 20px; right: 20px; }
  .projects { bottom: 24px; font-size: 0.75rem; }
}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui">
  <div class="logo">DRY MEADOW</div>
  <button id="menu-btn">☰</button>
  <div class="projects">PROJECTS</div>
  <button id="speaker" title="Toggle Audio">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>
  <canvas id="waveform"></canvas>
</div>
<div class="side-menu" id="sideMenu">
  <button class="close-menu" id="closeMenu">✕</button>
  <a href="https://radicaldeepscale.com/brpnaudio.html" target="_blank">Arc Edge Audio</a>
  <a href="https://dartmeadow.artstation.com/" target="_blank">Animation</a>
  <a href="#" target="_blank">Shop</a>
  <a href="mailto:justin@drymeadow.com">Contact</a>
  <a href="https://music.apple.com/us/artist/drymeadow/1774189791" target="_blank">Apple Music</a>
  <a href="https://youtube.com/@dry.meadow" target="_blank">YouTube</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.2);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 2.8;
controls.maxDistance = 8;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// Procedural sun matching the grainy orange look
const sunGeo = new THREE.SphereGeometry(1.15, 128, 128);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xff6b00 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Granulation texture via canvas
const texCanvas = document.createElement('canvas');
texCanvas.width = 512; texCanvas.height = 512;
const ctx = texCanvas.getContext('2d');
const imgData = ctx.createImageData(512, 512);
for (let i = 0; i < imgData.data.length; i += 4) {
  const n = Math.random() * 0.4 + 0.6;
  imgData.data[i] = 255 * n;
  imgData.data[i+1] = 120 * n;
  imgData.data[i+2] = 20 * n;
  imgData.data[i+3] = 255;
}
ctx.putImageData(imgData, 0, 0);
const texture = new THREE.CanvasTexture(texCanvas);
sun.material.map = texture;
sun.material.needsUpdate = true;

// Corona / glow
const coronaGeo = new THREE.SphereGeometry(1.22, 64, 64);
const coronaMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.25, side: THREE.BackSide });
const corona = new THREE.Mesh(coronaGeo, coronaMat);
scene.add(corona);

// Orbital arcs (simple rings)
function makeArc(radius, thickness, color, opacity) {
  const geo = new THREE.RingGeometry(radius, radius + thickness, 128);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = Math.random() * Math.PI;
  mesh.rotation.y = Math.random() * Math.PI;
  return mesh;
}
scene.add(makeArc(1.6, 0.008, 0xff8844, 0.6));
scene.add(makeArc(1.9, 0.006, 0xff6622, 0.4));
scene.add(makeArc(2.2, 0.005, 0xffaa55, 0.3));

// Lights
scene.add(new THREE.AmbientLight(0xffaa66, 0.4));

// Audio + waveform
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 256;
const dataArray = new Uint8Array(analyser.frequencyBinCount);
let audioSource = null;
let isPlaying = false;
const speakerBtn = document.getElementById('speaker');
const waveCanvas = document.getElementById('waveform');
const wCtx = waveCanvas.getContext('2d');

function resizeWave() {
  waveCanvas.width = window.innerWidth;
  waveCanvas.height = 60;
}
resizeWave();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  resizeWave();
});

// Placeholder MP3 — replace with your track
const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
audio.crossOrigin = 'anonymous';
audio.loop = true;

speakerBtn.addEventListener('click', async () => {
  if (!isPlaying) {
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!audioSource) {
      audioSource = audioCtx.createMediaElementSource(audio);
      audioSource.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
    audio.play();
    isPlaying = true;
    speakerBtn.style.opacity = '1';
  } else {
    audio.pause();
    isPlaying = false;
    speakerBtn.style.opacity = '0.5';
  }
});

function drawWave() {
  requestAnimationFrame(drawWave);
  if (!isPlaying) {
    wCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
    return;
  }
  analyser.getByteTimeDomainData(dataArray);
  wCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
  wCtx.lineWidth = 1.5;
  wCtx.strokeStyle = 'rgba(255,170,60,0.7)';
  wCtx.beginPath();
  const slice = waveCanvas.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = dataArray[i] / 128.0;
    const y = (v * waveCanvas.height) / 2;
    if (i === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    x += slice;
  }
  wCtx.stroke();
}
drawWave();

// Menu
const menuBtn = document.getElementById('menu-btn');
const sideMenu = document.getElementById('sideMenu');
const closeMenu = document.getElementById('closeMenu');
menuBtn.addEventListener('click', () => sideMenu.classList.add('open'));
closeMenu.addEventListener('click', () => sideMenu.classList.remove('open'));

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  sun.rotation.y += 0.002;
  corona.rotation.y -= 0.001;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
