<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dry Meadow | Official Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#000; --text:#fff; --accent:#ffaa33; --border:rgba(255,255,255,0.15); }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--bg); color:var(--text); font-family:'Oswald',sans-serif; }
#hero { position:relative; height:100vh; width:100%; overflow:hidden; }
#canvas-container { position:absolute; inset:0; z-index:1; }
#ui { position:absolute; inset:0; z-index:10; pointer-events:none; }
#ui > * { pointer-events:auto; }
.logo { position:absolute; top:28px; left:36px; font-size:1.4rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
.projects { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); text-align:center; font-size:0.85rem; letter-spacing:4px; text-transform:uppercase; }
#speaker { position:absolute; bottom:36px; right:36px; width:44px; height:44px; border:1px solid var(--border); background:rgba(0,0,0,0.4); color:var(--text); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
#menu-btn { position:absolute; top:24px; right:36px; background:none; border:none; color:var(--text); font-size:1.8rem; cursor:pointer; }
.side-menu { position:fixed; top:0; right:-320px; width:300px; height:100%; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); border-left:1px solid var(--border); transition:right 0.35s ease; z-index:20; padding:80px 32px; }
.side-menu.open { right:0; }
.side-menu a { display:block; color:var(--text); text-decoration:none; font-size:1.3rem; margin:22px 0; text-transform:uppercase; }
#waveform { position:absolute; bottom:120px; left:0; width:100%; height:60px; pointer-events:none; z-index:5; }
.content { position:relative; z-index:5; background:#000; padding:60px 20px; }
.shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; max-width:900px; margin:0 auto; }
.shop-item { background:#1a1a1a; padding:30px; text-align:center; border-radius:8px; }
</style>
</head>
<body>
<div id="hero">
  <div id="canvas-container"></div>
  <div id="ui">
    <div class="logo">DRY MEADOW</div>
    <button id="menu-btn">☰</button>
    <div class="projects">PROJECTS</div>
    <button id="speaker">🔊</button>
    <canvas id="waveform"></canvas>
  </div>
</div>
<div class="content">
  <h2 style="text-align:center; margin-bottom:30px;">SHOP</h2>
  <div class="shop-grid">
    <div class="shop-item">Music</div>
    <div class="shop-item">Animation</div>
    <div class="shop-item">Contact</div>
  </div>
  <div style="text-align:center; margin-top:60px;">
    <h3>NEWSLETTER</h3>
    <form style="margin-top:15px;">
      <input type="email" placeholder="Email" style="padding:10px; margin-right:10px;">
      <button type="submit" style="padding:10px 20px;">Subscribe</button>
    </form>
  </div>
</div>
<div class="side-menu" id="sideMenu">
  <a href="https://radicaldeepscale.com/brpnaudio.html">Arc Edge Audio</a>
  <a href="https://dartmeadow.artstation.com/">Animation</a>
  <a href="https://dart-meadow-shop.fourthwall.com/">Shop</a>
  <a href="mailto:justin@drymeadow.com">Contact</a>
  <a href="https://music.apple.com/us/artist/drymeadow/1774189791">Apple Music</a>
  <a href="https://youtube.com/@dry.meadow">YouTube</a>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { WebGPURenderer } from 'three/webgpu';
import * as TSL from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.2);

const renderer = new WebGPURenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
await renderer.init();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// Simplified TSL plasma sun approximating the game
const { uniform, vec3, sin, mix, smoothstep, time, float, normalize, positionLocal, normalWorld, cameraPosition } = TSL;

const U = {
  deep: uniform(new THREE.Color(0.6, 0.4, 0.1)),
  mid: uniform(new THREE.Color(0.95, 0.7, 0.3)),
  hot: uniform(new THREE.Color(1.0, 0.85, 0.4)),
  core: uniform(new THREE.Color(1.0, 0.95, 0.75)),
  seed: uniform(new THREE.Vector3(1.7, 2.3, 3.1)),
  speed: uniform(1.0)
};

function plasma(d) {
  const t = time.mul(U.speed);
  const nz = x => sin(x.x.mul(3.1).add(x.y.mul(1.7))).mul(sin(x.y.mul(2.7).sub(x.z.mul(1.3))));
  const p0 = d.mul(40).add(U.seed);
  const fl = p0.add(sin(p0.yzx.mul(0.9).add(t.mul(0.12))).mul(0.6));
  const mott = nz(fl.mul(0.55)).mul(0.5).add(0.5);
  const v1 = float(1).sub(nz(fl).abs()).pow(4.0);
  let g = float(0.1).add(mott.mul(0.25)).add(v1.mul(0.4));
  g = g.clamp(0, 1);
  let col = mix(U.deep, U.mid, smoothstep(0.2, 0.5, g));
  col = mix(col, U.hot, smoothstep(0.5, 0.75, g));
  col = mix(col, U.core, smoothstep(0.8, 1.0, g));
  return col;
}

const sunMat = new THREE.MeshBasicNodeMaterial();
const d = normalize(positionLocal);
const V = normalize(cameraPosition.sub(positionLocal)); // approx
const ndv = normalWorld.dot(V).clamp(0, 1);
const limb = ndv.pow(0.3).mul(0.25).add(0.75);
sunMat.colorNode = plasma(d).mul(limb);
sunMat.toneMapped = false;

const sun = new THREE.Mesh(new THREE.SphereGeometry(1.2, 128, 128), sunMat);
scene.add(sun);

// Corona
const coronaMat = new THREE.MeshBasicNodeMaterial({ transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false });
coronaMat.colorNode = mix(U.hot, U.core, 0.5).mul(0.4);
coronaMat.opacityNode = float(0.35);
const corona = new THREE.Mesh(new THREE.SphereGeometry(1.35, 64, 64), coronaMat);
scene.add(corona);

// Music playlist from game
const tracks = [
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/clinical_bloom.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/skyboard_journey.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/colder_than_the_sun.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/temple_of_light.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/velvet_horizon.mp3',
  'https://raw.githubusercontent.com/dartsolarpunk/dartmeadow-space/main/music/light_years_in_glass.mp3'
];
let current = 0;
const audio = new Audio();
audio.crossOrigin = 'anonymous';
function playRandom() {
  current = Math.floor(Math.random() * tracks.length);
  audio.src = tracks[current];
  audio.play().catch(() => {});
}
audio.addEventListener('ended', playRandom);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = audioCtx.createAnalyser();
analyser.fftSize = 256;
const dataArray = new Uint8Array(analyser.frequencyBinCount);
let source = null;
let playing = false;
const speaker = document.getElementById('speaker');
const wave = document.getElementById('waveform');
const wCtx = wave.getContext('2d');

speaker.addEventListener('click', async () => {
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (!source) {
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if (!playing) {
    if (!audio.src) playRandom();
    else audio.play();
    playing = true;
    speaker.textContent = '🔇';
  } else {
    audio.pause();
    playing = false;
    speaker.textContent = '🔊';
  }
});

function drawWave() {
  requestAnimationFrame(drawWave);
  if (!playing) { wCtx.clearRect(0,0,wave.width,wave.height); return; }
  analyser.getByteTimeDomainData(dataArray);
  wCtx.clearRect(0,0,wave.width,wave.height);
  wCtx.strokeStyle = 'rgba(255,170,60,0.7)';
  wCtx.beginPath();
  const slice = wave.width / dataArray.length;
  let x = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const y = (dataArray[i] / 128.0 * wave.height) / 2;
    if (i === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    x += slice;
  }
  wCtx.stroke();
}
drawWave();

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  wave.width = window.innerWidth;
  wave.height = 60;
}
window.addEventListener('resize', resize);
resize();

document.getElementById('menu-btn').onclick = () => document.getElementById('sideMenu').classList.toggle('open');

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
